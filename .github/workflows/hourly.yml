name: Hourly data and forecasts

on:
  schedule:
    - cron: "17 * * * *"   # every hour at minute 17 (UTC); off the busy :00 slot
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: hourly-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh        # same local time as the PC version
      MODEL_DIR: cloud_models     # models exported with export_models.py
      OM_MAX_WAIT: "120"          # do not wait long when the API rate limit is hit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: Install packages
        run: pip install -r requirements-actions.txt

      - name: Collect data and make forecasts
        run: |
          mkdir -p data/realtime live/realtime
          cp live/realtime/*.csv data/realtime/ 2>/dev/null || true
          python collect_realtime.py --once
          cp data/realtime/*.csv live/realtime/

      - name: Save new data to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/realtime
          if git diff --cached --quiet; then echo "No new data"; exit 0; fi
          git commit -m "Hourly data $(date '+%Y-%m-%d %H:%M') (UTC+7)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            sleep 5
          done

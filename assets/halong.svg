<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" preserveAspectRatio="xMaxYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f3f6" stop-opacity="0"/>
      <stop offset="1" stop-color="#d9eef1"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe0e0"/>
      <stop offset="1" stop-color="#e6f3f6"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4e7"/>
      <stop offset="1" stop-color="#dbecee"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fcbcb"/>
      <stop offset="1" stop-color="#bcdcdb"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9e97"/>
      <stop offset="1" stop-color="#78b6b0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="240" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="470" cy="70" r="30" fill="#f7dfb0" opacity=".9"/>
  <circle cx="470" cy="70" r="46" fill="#f7dfb0" opacity=".25"/>
  <!-- far karst towers -->
  <path fill="url(#far)" d="M150 178 C152 120 168 104 178 108 C190 112 192 150 196 178 Z
    M205 178 C206 140 214 126 224 128 C236 131 236 160 240 178 Z
    M300 178 C298 110 318 84 332 88 C348 92 346 140 352 178 Z
    M520 178 C520 128 534 112 546 116 C560 120 560 152 566 178 Z
    M590 178 C590 140 600 128 610 130 C622 133 622 160 626 178 Z"/>
  <!-- mid karst towers -->
  <path fill="url(#mid)" d="M230 182 C226 128 244 100 262 104 C282 108 280 150 288 182 Z
    M360 182 C356 140 368 118 382 120 C398 122 396 156 402 182 Z
    M410 182 C404 118 426 86 446 92 C468 98 462 150 470 182 Z
    M560 182 C556 146 570 132 582 134 C596 137 594 162 600 182 Z"/>
  <!-- near karst towers -->
  <path fill="url(#near)" d="M330 190 C322 140 340 112 360 116 C382 120 376 160 386 190 Z
    M470 190 C462 128 486 96 508 102 C532 108 524 158 536 190 Z
    M600 190 C596 150 612 134 626 138 C640 142 640 170 640 190 Z"/>
  <!-- little trees on the near towers -->
  <path fill="#3f8a83" opacity=".7" d="M348 120 q4 -6 8 0 q4 -5 8 1 z M490 104 q5 -7 10 0 q5 -6 10 1 z"/>
  <!-- sea -->
  <rect y="186" width="640" height="54" fill="url(#sea)"/>
  <!-- reflections -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".7">
    <line x1="340" y1="198" x2="372" y2="198"/>
    <line x1="480" y1="200" x2="522" y2="200"/>
    <line x1="410" y1="212" x2="440" y2="212"/>
    <line x1="560" y1="216" x2="600" y2="216"/>
    <line x1="250" y1="206" x2="276" y2="206"/>
  </g>
  <!-- junk boat with fan sails -->
  <g transform="translate(398 186)">
    <path d="M-26 0 L26 0 L20 9 L-20 9 Z" fill="#5a3b2e"/>
    <path d="M-14 0 L-14 -34 C-4 -28 0 -16 2 0 Z" fill="#0d8a80"/>
    <path d="M6 0 L6 -26 C14 -21 18 -12 20 0 Z" fill="#14a196"/>
    <g stroke="#e1f4f1" stroke-width=".8" opacity=".8">
      <line x1="-14" y1="-26" x2="-2" y2="-22"/><line x1="-14" y1="-18" x2="0" y2="-14"/><line x1="-14" y1="-9" x2="1" y2="-6"/>
      <line x1="6" y1="-18" x2="15" y2="-15"/><line x1="6" y1="-9" x2="18" y2="-7"/>
    </g>
  </g>
  <!-- birds -->
  <g fill="none" stroke="#5d6d77" stroke-width="1.4" stroke-linecap="round" opacity=".6">
    <path d="M300 54 q5 -5 10 0 q5 -5 10 0"/>
    <path d="M326 40 q4 -4 8 0 q4 -4 8 0"/>
  </g>
</svg>
